name: Release RSC Legacy

on:
  push:
    branches:
      - main
    paths:
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version = ' build.gradle.kts | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          if [ -z "$VERSION" ]; then
            echo 'Unable to determine version from build.gradle.kts' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release tag exists
        id: tag_check
        shell: bash
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release JAR
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace

      - name: Create GitHub release with raw JAR
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SF RykenSlimeCustomizer ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: build/libs/SF_RykenSlimeCustomizer${{ steps.version.outputs.version }}.jar
          fail_on_unmatched_files: true
