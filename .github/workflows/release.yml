name: Legacy manual release disabled - use protected build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-entrypoint:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse the obsolete release path
        shell: bash
        run: |
          echo '::error::This obsolete release workflow cannot publish or replace assets.'
          echo 'Use Build RykenSlimeCustomizer (.github/workflows/build.yml) on main.'
          echo 'Publish only a new version after its checks pass, with publish=true and the exact confirm_version.'
          exit 1
