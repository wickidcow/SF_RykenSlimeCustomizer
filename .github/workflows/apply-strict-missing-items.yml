name: Apply Strict Missing Item Handling

on:
  push:
    branches:
      - strict-missing-item-handling
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply strict missing-item patch
        run: python scripts/apply_strict_missing_items.py

      - name: Verify stone fallback is gone from item resolution
        run: |
          if grep -n "已转为石头" src/main/java/org/lins/mmmjjkx/rykenslimefuncustomizer/utils/CommonUtils.java; then
            echo "Legacy stone fallback is still present"
            exit 1
          fi
          grep -n "The containing item or recipe will be skipped" src/main/java/org/lins/mmmjjkx/rykenslimefuncustomizer/utils/CommonUtils.java

      - name: Commit Java changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java
          if git diff --cached --quiet; then
            echo "No Java changes to commit"
            exit 0
          fi
          git commit -m "Skip unresolved addon items instead of substituting stone"
          git push origin HEAD:strict-missing-item-handling
