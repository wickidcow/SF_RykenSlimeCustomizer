name: Apply no-Guizhan English cleanup

on:
  push:
    branches:
      - cleanup/no-guizhan-english
    paths:
      - tools/apply_no_guizhan_english_cleanup.py
      - .github/workflows/apply-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/no-guizhan-english
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply deterministic cleanup
        run: python3 tools/apply_no_guizhan_english_cleanup.py

      - name: Verify GuizhanLib is no longer required
        shell: bash
        run: |
          if grep -RInE 'net\.guizhanss\.guizhanlib|libs\.guizhan\.lib\.plugin|^[[:space:]]*-[[:space:]]*GuizhanLibPlugin[[:space:]]*$' \
            src build.gradle.kts gradle/libs.versions.toml; then
            echo 'GuizhanLib dependency/API references remain.' >&2
            exit 1
          fi

      - name: Build and test against Slimefun Legacy
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace

      - name: Verify Java 21 bytecode
        run: |
          python3 - <<'PY'
          import pathlib, struct, zipfile
          jars = list(pathlib.Path('build/libs').glob('SF_RykenSlimeCustomizer*.jar'))
          if len(jars) != 1:
              raise SystemExit(f'Expected exactly one release JAR, found: {jars}')
          with zipfile.ZipFile(jars[0]) as zf:
              majors = []
              for name in zf.namelist():
                  if not name.endswith('.class'):
                      continue
                  data = zf.read(name)[:8]
                  if data[:4] == b'\xca\xfe\xba\xbe':
                      majors.append(struct.unpack('>H', data[6:8])[0])
          if majors and max(majors) > 65:
              raise SystemExit(f'Class major {max(majors)} exceeds Java 21')
          print(f'Java bytecode OK; max class major={max(majors) if majors else "n/a"}')
          PY

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src build.gradle.kts gradle/libs.versions.toml tools/player-facing-cjk-report.txt
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'Remove GuizhanLib dependency and translate core-facing text'
          git push origin HEAD:cleanup/no-guizhan-english
