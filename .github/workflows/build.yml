name: Build RSC Legacy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace

      - name: Verify Java 21 bytecode
        run: |
          python3 - <<'PY'
          import pathlib, struct, zipfile
          jars = list(pathlib.Path('build/libs').glob('SF_RykenSlimeCustomizer*.jar'))
          if len(jars) != 1:
              raise SystemExit(f'Expected exactly one release JAR, found: {jars}')
          jar = jars[0]
          max_major = 0
          with zipfile.ZipFile(jar) as zf:
              for name in zf.namelist():
                  if not name.endswith('.class'):
                      continue
                  data = zf.read(name)[:8]
                  if data[:4] != b'\xca\xfe\xba\xbe':
                      continue
                  major = struct.unpack('>H', data[6:8])[0]
                  max_major = max(max_major, major)
          print(f'{jar}: maximum class major version {max_major}')
          if max_major > 65:
              raise SystemExit('JAR contains classes newer than Java 21 bytecode')
          PY

      - name: Upload JAR build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SF_RykenSlimeCustomizer-raw-jar
          path: build/libs/SF_RykenSlimeCustomizer*.jar
          if-no-files-found: error
