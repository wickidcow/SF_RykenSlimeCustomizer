name: Build RykenSlimeCustomizer

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a new, immutable release'
        required: true
        type: boolean
        default: false
      confirm_version:
        description: 'Type the exact version when publishing'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  VERSION: "3.1.11"
  OUTPUT_NAME: "SF_RykenSlimeCustomizer3.1.11.jar"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify retained compiler diagnostics contract
        run: python3 -m unittest discover -s scripts -p 'test_compiler_diagnostics_policy.py' -v

      - name: Verify Paper 1.21.11 / Java 21 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          chmod +x gradlew
          ./gradlew clean build --stacktrace --no-daemon --warning-mode all -PpaperVersion=1.21.11-R0.1-SNAPSHOT -PtargetJvm=21 2>&1 | tee ci-evidence/1.21.11-build.log

      - name: Stage universal release JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="build/libs/${OUTPUT_NAME}"
          test -s "$JAR"
          cp "$JAR" "dist/${OUTPUT_NAME}"
          unzip -tqq "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"

      - name: Verify Java 21 bytecode
        run: |
          python3 - <<'PY'
          import struct, zipfile
          jar = 'dist/SF_RykenSlimeCustomizer3.1.11.jar'
          max_major = 0
          with zipfile.ZipFile(jar) as zf:
              for name in zf.namelist():
                  if not name.endswith('.class'):
                      continue
                  data = zf.read(name)[:8]
                  if data[:4] != b'\xca\xfe\xba\xbe':
                      continue
                  max_major = max(max_major, struct.unpack('>H', data[6:8])[0])
          print(f'{jar}: maximum class major version {max_major}')
          if max_major > 65:
              raise SystemExit('JAR contains classes newer than Java 21 bytecode')
          PY

      - name: Verify Paper 26.2 compilation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          ./gradlew clean compileJava test --stacktrace --no-daemon --warning-mode all -PpaperVersion=26.2.build.+ -PtargetJvm=25 2>&1 | tee ci-evidence/26.2-compile.log

      - name: Verify Paper 26.3 compilation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          ./gradlew clean compileJava test --stacktrace --no-daemon --warning-mode all -PpaperVersion=26.3.build.205-stable -PtargetJvm=25 2>&1 | tee ci-evidence/26.3-compile.log

      - name: Retain exact-head compiler and build warnings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ryken-compiler-diagnostics
          path: ci-evidence/*.log
          if-no-files-found: warn

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

      - name: Verify future releases cannot clobber previous assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/build.yml').read_text()
          assert ('--'+'clobber') not in text
          assert '26.3.build.205-stable' in text
          assert "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true" in text
          print('Immutable-release and stable-Paper checks passed')
          PY


  publish:
    name: Publish immutable RykenSlimeCustomizer release
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist
          skip-decompress: true
      - name: Refuse stale, wrong-version or existing releases
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$CURRENT_MAIN" = "$GITHUB_SHA"
          test "$CONFIRM_VERSION" = "$VERSION"
          grep -Fq 'version = "3.1.11"' build.gradle.kts
          test -s "dist/$OUTPUT_NAME"
          unzip -tqq "dist/$OUTPUT_NAME"
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace existing immutable release $TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Refusing to replace existing immutable Git tag $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish a new immutable release exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          test -n "$TAG"
          gh release create "$TAG" "dist/$OUTPUT_NAME" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "SF_RykenSlimeCustomizer $TAG" \
            --notes "Validated Java 21 Slimefun Legacy build with Paper 1.21.11/26.2/26.3 source compatibility. All previous tags and release assets remain unchanged."
      - name: Compare release digest and redownloaded JAR bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          release=json.loads((Path(os.environ['RUNNER_TEMP'])/'release.json').read_text())
          jar=Path('dist')/os.environ['OUTPUT_NAME']
          assert release['tag_name']=='v'+os.environ['VERSION']
          assert release['target_commitish']==os.environ['GITHUB_SHA']
          assert len(release['assets'])==1
          asset=release['assets'][0]
          assert asset['name']==jar.name and asset['state']=='uploaded'
          assert asset['size']==jar.stat().st_size
          assert asset['digest']=='sha256:'+hashlib.sha256(jar.read_bytes()).hexdigest()
          PY
          mkdir -p verified
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "$OUTPUT_NAME" --dir verified
          cmp "dist/$OUTPUT_NAME" "verified/$OUTPUT_NAME"
