name: Build RykenSlimeCustomizer

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "3.1.9"
  OUTPUT_NAME: "SF_RykenSlimeCustomizer3.1.9.jar"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Paper 1.21.11 / Java 21 baseline
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace --no-daemon -PpaperVersion=1.21.11-R0.1-SNAPSHOT -PtargetJvm=21

      - name: Stage universal release JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="build/libs/${OUTPUT_NAME}"
          test -s "$JAR"
          cp "$JAR" "dist/${OUTPUT_NAME}"
          unzip -tqq "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"

      - name: Verify Java 21 bytecode
        run: |
          python3 - <<'PY'
          import struct, zipfile
          jar = 'dist/SF_RykenSlimeCustomizer3.1.9.jar'
          max_major = 0
          with zipfile.ZipFile(jar) as zf:
              for name in zf.namelist():
                  if not name.endswith('.class'):
                      continue
                  data = zf.read(name)[:8]
                  if data[:4] != b'\xca\xfe\xba\xbe':
                      continue
                  max_major = max(max_major, struct.unpack('>H', data[6:8])[0])
          print(f'{jar}: maximum class major version {max_major}')
          if max_major > 65:
              raise SystemExit('JAR contains classes newer than Java 21 bytecode')
          PY

      - name: Verify Paper 26.2 compilation
        run: ./gradlew clean compileJava test --stacktrace --no-daemon -PpaperVersion=26.2.build.+ -PtargetJvm=25

      - name: Verify Paper 26.3 compilation
        run: ./gradlew clean compileJava test --stacktrace --no-daemon -PpaperVersion=26.3-rc-3.build.1-alpha -PtargetJvm=25

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          NOTES="RykenSlimeCustomizer 3.1.9 adds Paper 26.3 compatibility validation while preserving the Java 21 universal release baseline and Paper 26.2 as the primary production target. The Legacy suffix version scheme is replaced by the standard ${OUTPUT_NAME} public artifact."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "SF_RykenSlimeCustomizer $TAG" --notes "$NOTES"
          fi
